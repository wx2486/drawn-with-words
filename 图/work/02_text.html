pan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.30">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.40">我思故我在。</tspan></text>
<text class="ln" x="143.73" y="1227.25" data-r="2259.1" font-size="10.71" fill="#fff" xml:space="preserve" transform="rotate(-0.0151 143.7 1227.2)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.05">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.49">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.54">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.28">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.56">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.20">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-1.02">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.78">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.49">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.65">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.10">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.47">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.10">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.15">Je suis moi-même la matière de mon livre.</tspan></text>
<text class="ln" x="138.76" y="1241.74" data-r="2255.9" font-size="10.07" fill="#fff" xml:space="preserve" transform="rotate(0.0067 138.8 1241.7)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.16">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.31">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.27">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.19">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.76">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.96">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.63">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.82">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.04">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.38">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.31">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.70">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.16">To be, or not to be, that is the question:</tspan></text>
<text class="ln" x="143.03" y="1255.54" data-r="2256.3" font-size="10.40" fill="#fff" xml:space="preserve" transform="rotate(0.0297 143.0 1255.5)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.03">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.14">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.09">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.01">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.39">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.14">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.05">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.17">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.18">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.26">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.54">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan></text>
<text class="ln" x="140.82" y="1269.88" data-r="2255.3" font-size="10.73" fill="#fff" xml:space="preserve" transform="rotate(0.0365 140.8 1269.9)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.58">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.56">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.15">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.36">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.50">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.25">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.18">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.19">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">Werde, der du bist.</tspan></text>
<text class="ln" x="140.69" y="1283.30" data-r="2254.3" font-size="10.29" fill="#fff" xml:space="preserve" transform="rotate(-0.0028 140.7 1283.3)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.11">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.32">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.81">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.21">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.01">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.35">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.29">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.54">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.31">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.72">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.01">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.60">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan></text>
<text class="ln" x="139.12" y="1297.82" data-r="2259.0" font-size="10.68" fill="#fff" xml:space="preserve" transform="rotate(0.0160 139.1 1297.8)"><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.23">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.38">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.16">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.01">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.00">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.17">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.45">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.13">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.26">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.22">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.15">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan></text>
<text class="ln" x="143.69" y="1311.55" data-r="2251.7" font-size="10.02" fill="#fff" xml:space="preserve" transform="rotate(0.0048 143.7 1311.5)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.34">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="-0.45">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.43">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.13">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.19">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.76">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.64">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.79">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.81">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.47">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.15">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.08">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.12">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.16">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.66">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.58">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan></text>
<text class="ln" x="142.40" y="1326.16" data-r="2257.5" font-size="10.55" fill="#fff" xml:space="preserve" transform="rotate(0.0204 142.4 1326.2)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.31">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.55">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.39">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.29">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.22">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.33">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.63">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.02">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.28">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.35">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.53">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.20">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.44">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.53">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.06">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.10">Je suis moi-même la matière de mon livre.</tspan></text>
<text class="ln" x="143.17" y="1340.20" data-r="2256.3" font-size="10.10" fill="#fff" xml:space="preserve" transform="rotate(0.0201 143.2 1340.2)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.44">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.38">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.21">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.53">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.43">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.43">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.87">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.79">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.14">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.48">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.02">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.02">天生我材必有用，千金散尽还复来。</tspan></text>
<text class="ln" x="143.54" y="1353.68" data-r="2258.2" font-size="10.47" fill="#fff" xml:space="preserve" transform="rotate(0.0152 143.5 1353.7)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.26">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.04">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.54">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.12">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.46">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.16">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.05">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.02">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.27">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.33">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.66">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.32">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.01">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.14">I celebrate myself, and sing myself,</tspan></text>
<text class="ln" x="143.78" y="1367.58" data-r="2258.7" font-size="10.79" fill="#fff" xml:space="preserve" transform="rotate(0.0462 143.8 1367.6)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.24">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.51">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.38">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.34">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="-0.94">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.34">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.29">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.52">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.49">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.29">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.22">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.33">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.63">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.43">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.07">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan></text>
<text class="ln" x="139.15" y="1381.70" data-r="2256.2" font-size="10.28" fill="#fff" xml:space="preserve" transform="rotate(0.0327 139.1 1381.7)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.08">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.11">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.28">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.16">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.21">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.73">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-1.00">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.74">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.01">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.05">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan></text>
<text class="ln" x="141.71" y="1395.04" data-r="2257.8" font-size="10.10" fill="#fff" xml:space="preserve" transform="rotate(-0.0127 141.7 1395.0)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.20">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.55">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.36">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.24">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.00">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.10">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.30">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.65">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.19">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.25">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.47">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.58">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.20">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.33">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan></text>
<text class="ln" x="143.40" y="1409.81" data-r="2258.5" font-size="10.02" fill="#fff" xml:space="preserve" transform="rotate(0.0268 143.4 1409.8)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.37">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.36">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.55">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.05">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.28">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.47">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.13">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.49">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.95">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.36">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan></text>
<text class="ln" x="143.36" y="1423.40" data-r="2254.7" font-size="10.74" fill="#fff" xml:space="preserve" transform="rotate(0.0198 143.4 1423.4)"><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.14">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.12">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.38">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.12">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.40">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.41">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.55">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.74">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.00">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.55">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.27">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan></text>

<text class="ln" x="142.44" y="1479.71" data-r="2251.8" font-size="10.16" fill="#fff" xml:space="preserve" transform="rotate(-0.0115 142.4 1479.7)"><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.11">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.36">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.48">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.21">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.15">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.03">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.15">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.25">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.33">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.03">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.26">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.24">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.27">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan></text>
<text class="ln" x="140.68" y="1494.30" data-r="2257.6" font-size="10.62" fill="#fff" xml:space="preserve" transform="rotate(-0.0275 140.7 1494.3)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.25">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.16">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.36">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.50">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.10">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.51">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.29">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.15">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.14">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.04">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.48">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.69">我思故我在。</tspan></text>
<text class="ln" x="141.97" y="1507.41" data-r="2256.9" font-size="10.69" fill="#fff" xml:space="preserve" transform="rotate(0.0305 142.0 1507.4)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.24">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.15">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.20">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.48">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.67">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.10">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.42">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.38">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.31">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.01">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.30">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan></text>
<text class="ln" x="143.53" y="1521.56" data-r="2257.9" font-size="10.94" fill="#fff" xml:space="preserve" transform="rotate(0.0121 143.5 1521.6)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.16">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.43">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.71">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.41">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.17">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.37">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.43">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.33">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.66">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan></text>
<text class="ln" x="139.92" y="1535.31" data-r="2254.7" font-size="10.27" fill="#fff" xml:space="preserve" transform="rotate(0.0200 139.9 1535.3)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.08">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.16">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.25">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.39">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.24">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.17">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.00">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.11">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.06">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.45">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.78">तत् त्वम् असि</tspan></text>
<text class="ln" x="138.02" y="1549.79" data-r="2253.4" font-size="10.53" fill="#fff" xml:space="preserve" transform="rotate(-0.0139 138.0 1549.8)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.31">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.22">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.25">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.45">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.42">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.03">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.01">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.03">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.10">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.34">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.52">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.59">To be, or not to be, that is the question:</tspan></text>
<text class="ln" x="142.42" y="1563.86" data-r="2255.5" font-size="10.02" fill="#fff" xml:space="preserve" transform="rotate(0.0208 142.4 1563.9)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.30">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.24">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.27">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.01">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.07">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.70">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.37">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.38">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.73">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.06">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.31">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.00">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.36">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.12">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.23">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.07">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.47">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan></text>
<text class="ln" x="138.01" y="1577.40" data-r="2259.8" font-size="10.01" fill="#fff" xml:space="preserve" transform="rotate(-0.0163 138.0 1577.4)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.32">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.33">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="-0.32">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.20">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.30">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.00">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.47">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.17">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.55">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.00">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.42">不识庐山真面目，只缘身在此山中。</tspan></text>
<text class="ln" x="143.64" y="1591.71" data-r="2254.8" font-size="10.41" fill="#fff" xml:space="preserve" transform="rotate(0.0422 143.6 1591.7)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.37">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.52">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.19">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.41">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.50">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.19">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.20">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.52">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.52">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.27">This above all: to thine own self be true,</tspan></text>
<text class="ln" x="141.87" y="1605.48" data-r="2252.4" font-size="10.44" fill="#fff" xml:space="preserve" transform="rotate(0.0077 141.9 1605.5)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.03">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.35">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.11">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.18">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.54">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.16">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.68">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="-0.25">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.67">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.41">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.28">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.21">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan></text>
<text class="ln" x="141.04" y="1619.53" data-r="2255.1" font-size="10.71" fill="#fff" xml:space="preserve" transform="rotate(-0.0208 141.0 1619.5)"><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.00">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.29">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.15">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.40">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.45">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.12">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.34">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.03">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.07">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.12">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.66">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan></text>
<text class="ln" x="141.57" y="1633.39" data-r="2259.8" font-size="10.97" fill="#fff" xml:space="preserve" transform="rotate(0.0204 141.6 1633.4)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.06">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.02">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.05">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.34">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.78">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="-0.40">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.50">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.61">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.08">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.58">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan>< <text class="ln" x="141.83" y="1646.93" data-r="2255.4" font-size="10.79" fill="#fff" xml:space="preserve" transform="rotate(0.0414 141.8 1646.9)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.11">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.05">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.16">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.30">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.34">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.43">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.05">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.29">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="l <text class="ln" x="142.34" y="1661.82" data-r="2251.4" font-size="10.93" fill="#fff" xml:space="preserve" transform="rotate(-0.0084 142.3 1661.8)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.11">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.57">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.91">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.58">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.27">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.24">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.63">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.42">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.41">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.29">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.48">在我的后园，可以看见墙外有两株树，一株是枣树
