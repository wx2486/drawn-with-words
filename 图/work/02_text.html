<text class="ln" x="139.40" y="150.01" data-r="2259.2" font-size="10.37" fill="#fff" xml:space="preserve" transform="rotate(-0.0320 139.4 150.0)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.26">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.09">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.45">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.10">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.33">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.26">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.35">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.20">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.57">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.24">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.16">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.22">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.16">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan></text>
<text class="ln" x="141.59" y="163.10" data-r="2254.0" font-size="10.07" fill="#fff" xml:space="preserve" transform="rotate(0.0404 141.6 163.1)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.05">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.30">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.02">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.78">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.68">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.49">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.07">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-1.05">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="1.03">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.44">Yo sé quién soy.</tspan></text>
<text class="ln" x="141.86" y="176.94" data-r="2254.1" font-size="10.19" fill="#fff" xml:space="preserve" transform="rotate(0.0256 141.9 176.9)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.42">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.09">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.23">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.25">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.06">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.39">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.05">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.08">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.01">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.09">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.72">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.39">问君何能尔？心远地自偏。</tspan></text>
<text class="ln" x="142.15" y="191.00" data-r="2255.7" font-size="10.61" fill="#fff" xml:space="preserve" transform="rotate(0.0075 142.2 191.0)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.13">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.11">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.10">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.02">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.04">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.21">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.40">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.35">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.36">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.25">知人者智，自知者明。胜人者有力，自胜者强。</tspan></text>
<text class="ln" x="143.40" y="205.35" data-r="2252.5" font-size="10.69" fill="#fff" xml:space="preserve" transform="rotate(-0.0222 143.4 205.3)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.05">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.06">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.26">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.58">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="1.15">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.43">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.59">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.79">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.38">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.39">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.22">This above all: to thine own self be true,</tspan></text>
<text class="ln" x="139.05" y="218.71" data-r="2253.1" font-size="10.79" fill="#fff" xml:space="preserve" transform="rotate(0.0235 139.0 218.7)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.19">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.35">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.15">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.12">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.14">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.25">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.45">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.40">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.06">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.08">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.26">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.46">天生我材必有用，千金散尽还复来。</tspan></text>
<text class="ln" x="139.76" y="233.26" data-r="2256.5" font-size="10.99" fill="#fff" xml:space="preserve" transform="rotate(0.0117 139.8 233.3)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.17">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.10">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.42">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.20">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.01">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.04">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.20">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.32">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan></text>
<text class="ln" x="138.16" y="247.39" data-r="2258.7" font-size="10.58" fill="#fff" xml:space="preserve" transform="rotate(-0.0215 138.2 247.4)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.18">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.03">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.44">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.46">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.14">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.14">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.24">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.04">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan></text>
<text class="ln" x="139.57" y="261.08" data-r="2252.3" font-size="10.36" fill="#fff" xml:space="preserve" transform="rotate(0.0008 139.6 261.1)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.19">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.36">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.45">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.20">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.90">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.99">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.28">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.00">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.35">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.58">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.08">吾生也有涯，而知也无涯。</tspan></text>
<text class="ln" x="141.61" y="275.52" data-r="2251.2" font-size="10.13" fill="#fff" xml:space="preserve" transform="rotate(-0.0249 141.6 275.5)"><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.27">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.38">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.15">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.50">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.56">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.18">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.45">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.07">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.08">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.17">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan></text>
<text class="ln" x="141.80" y="289.04" data-r="2258.2" font-size="10.11" fill="#fff" xml:space="preserve" transform="rotate(-0.0139 141.8 289.0)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.27">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.15">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.67">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.35">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.12">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.48">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.64">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.30">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.54">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.20">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.37">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.27">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.33">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan></text>
<text class="ln" x="138.26" y="303.44" data-r="2251.4" font-size="10.87" fill="#fff" xml:space="preserve" transform="rotate(-0.0065 138.3 303.4)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.02">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.23">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.20">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.27">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.36">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.19">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.03">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.22">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.07">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.19">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.33">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.07">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan></text>

<text class="ln" x="143.68" y="345.39" data-r="2251.9" font-size="10.09" fill="#fff" xml:space="preserve" transform="rotate(-0.0080 143.7 345.4)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.37">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.05">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.21">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.15">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.53">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.26">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.01">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.27">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.42">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.24">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.16">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.09">问君何能尔？心远地自偏。</tspan></text>
<text class="ln" x="140.89" y="359.22" data-r="2255.5" font-size="10.93" fill="#fff" xml:space="preserve" transform="rotate(0.0266 140.9 359.2)"><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="-0.40">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.27">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.32">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.82">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.36">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.69">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.58">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.00">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.44">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.01">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.19">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.38">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan></text>
<text class="ln" x="139.27" y="372.98" data-r="2253.6" font-size="10.86" fill="#fff" xml:space="preserve" transform="rotate(0.0074 139.3 373.0)"><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.29">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.01">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.75">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.44">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.23">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.47">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.24">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.35">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.36">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.13">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.58">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.05">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.18">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.10">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.07">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan></text>
<text class="ln" x="141.84" y="387.11" data-r="2252.0" font-size="10.50" fill="#fff" xml:space="preserve" transform="rotate(0.0010 141.8 387.1)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.48">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.57">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.06">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.07">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.32">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.06">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.01">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.17">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.22">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.00">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.15">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan></text>
<text class="ln" x="142.79" y="401.60" data-r="2255.1" font-size="10.21" fill="#fff" xml:space="preserve" transform="rotate(0.0361 142.8 401.6)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.00">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.06">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.05">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.39">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.04">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.38">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.13">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.32">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.34">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.56">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.19">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.09">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan></text>
<text class="ln" x="142.70" y="415.02" data-r="2258.3" font-size="10.79" fill="#fff" xml:space="preserve" transform="rotate(0.0266 142.7 415.0)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.05">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.34">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.15">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.06">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.19">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.49">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.02">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.65">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="1.28">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.06">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.07">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.59">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan></text>
<text class="ln" x="140.58" y="429.20" data-r="2252.5" font-size="10.04" fill="#fff" xml:space="preserve" transform="rotate(0.0254 140.6 429.2)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.30">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.58">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.28">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.33">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.82">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.72">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.64">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.60">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.25">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.34">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan></text>
<text class="ln" x="143.93" y="442.92" data-r="2258.2" font-size="10.93" fill="#fff" xml:space="preserve" transform="rotate(-0.0109 143.9 442.9)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.19">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.28">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.39">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.10">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.03">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.55">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.43">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.29">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.15">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.09">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.08">问君何能尔？心远地自偏。</tspan></text>
<text class="ln" x="141.67" y="456.64" data-r="2258.8" font-size="10.74" fill="#fff" xml:space="preserve" transform="rotate(0.0030 141.7 456.6)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.04">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.59">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.18">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.48">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.18">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.06">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.22">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.19">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.75">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.88">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.31">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan></text>
<text class="ln" x="138.34" y="471.11" data-r="2253.0" font-size="10.40" fill="#fff" xml:space="preserve" transform="rotate(-0.0112 138.3 471.1)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.08">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.15">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.47">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.87">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.53">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.25">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.83">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.79">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.01">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.37">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.25">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.15">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.45">γνῶθι σεαυτόν</tspan></text>
<text class="ln" x="140.17" y="484.90" data-r="2253.0" font-size="10.44" fill="#fff" xml:space="preserve" transform="rotate(0.0336 140.2 484.9)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.04">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.27">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.58">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.01">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.15">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.15">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.18">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.04">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.60">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.21">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.19">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.09">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.21">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.16">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.13">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.12">I celebrate myself, and sing myself,</tspan></text>
<text class="ln" x="143.89" y="498.40" data-r="2259.4" font-size="10.10" fill="#fff" xml:space="preserve" transform="rotate(-0.0217 143.9 498.4)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.44">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.31">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.20">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.05">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.03">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.93">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.65">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.16">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.06">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.37">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan></text>
<text class="ln" x="138.77" y="513.24" data-r="2254.6" font-size="10.54" fill="#fff" xml:space="preserve" transform="rotate(0.0155 138.8 513.2)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.13">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.11">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.31">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.42">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.37">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.42">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.03">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.02">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.03">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.02">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan></text>
<text class="ln" x="142.25" y="526.95" data-r="2259.1" font-size="10.62" fill="#fff" xml:space="preserve" transform="rotate(0.0057 142.2 526.9)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.04">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.21">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.50">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.56">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.10">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.83">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.57">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.06">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.19">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.11">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.19">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.09">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.05">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.66">Que sais-je ?</tspan></text>
<text class="ln" x="143.53" y="540.61" data-r="2257.2" font-size="10.10" fill="#fff" xml:space="preserve" transform="rotate(0.0023 143.5 540.6)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.23">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.38">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.71">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.08">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.00">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.21">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.12">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.23">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.05">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.14">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.12">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.15">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="-0.38">吾輩は猫である。名前はまだ無い。</tspan></text>
<text class="ln" x="140.40" y="555.23" data-r="2255.1" font-size="10.83" fill="#fff" xml:space="preserve" transform="rotate(0.0314 140.4 555.2)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.19">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.28">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.16">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.01">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.43">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.28">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.35">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.46">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.10">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan></text>
<text class="ln" x="138.47" y="568.26" data-r="2256.5" font-size="10.62" fill="#fff" xml:space="preserve" transform="rotate(0.0319 138.5 568.3)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.13">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.35">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.73">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.15">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-1.06">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.60">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.09">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.18">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.28">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.19">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.09">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.71">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.73">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.36">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan></text>
<text class="ln" x="142.25" y="583.25" data-r="2255.0" font-size="10.21" fill="#fff" xml:space="preserve" transform="rotate(-0.0089 142.3 583.2)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.63">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.51">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.03">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.11">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.15">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.79">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.09">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.32">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.11">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.48">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.05">不识庐山真面目，只缘身在此山中。</tspan></text>
<text class="ln" x="139.90" y="597.04" data-r="2256.4" font-size="10.30" fill="#fff" xml:space="preserve" transform="rotate(-0.0238 139.9 597.0)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.25">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.29">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.10">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.32">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.64">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="-0.11">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.63">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.42">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.17">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.09">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan></text>
<text class="ln" x="138.15" y="610.51" data-r="2258.9" font-size="10.07" fill="#fff" xml:space="preserve" transform="rotate(0.0142 138.1 610.5)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.06">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.02">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.07">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.10">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.42">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.61">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.19">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.09">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.17">Trust thyself: every heart vibrates to that iron string.</tspan></text>
