 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.05">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.08">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan></text>
<text class="ln" x="138.76" y="2487.41" data-r="2255.7" font-size="10.43" fill="#fff" xml:space="preserve" transform="rotate(-0.0245 138.8 2487.4)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.16">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.41">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.46">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.40">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.21">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="-0.24">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.41">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.04">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.34">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.26">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.02">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.41">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.15">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.34">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.09">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan></text>
<text class="ln" x="139.74" y="2501.85" data-r="2256.9" font-size="10.02" fill="#fff" xml:space="preserve" transform="rotate(-0.0281 139.7 2501.8)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.22">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.31">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.12">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.09">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.53">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.64">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.08">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="-0.06">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.16">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.11">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.37">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.56">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.85">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.60">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.09">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.75">Je suis moi-même la matière de mon livre.</tspan></text>
<text class="ln" x="144.44" y="2516.76" data-r="2259.1" font-size="10.16" fill="#fff" xml:space="preserve" transform="rotate(0.0055 144.4 2516.8)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.04">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.21">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.30">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.15">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-1.03">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.35">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.58">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.32">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.11">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="-0.32">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan></text>
<text class="ln" x="140.06" y="2530.49" data-r="2257.2" font-size="10.98" fill="#fff" xml:space="preserve" transform="rotate(0.0086 140.1 2530.5)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.15">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.32">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.47">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.05">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.34">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.73">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.71">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.08">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.14">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan></text>
<text class="ln" x="140.85" y="2544.18" data-r="2252.1" font-size="10.58" fill="#fff" xml:space="preserve" transform="rotate(0.0133 140.8 2544.2)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.39">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.09">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.56">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.51">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.31">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.18">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.87">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="1.00">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.32">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.00">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.13">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.37">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.08">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.50">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan></text>
<text class="ln" x="138.15" y="2558.44" data-r="2258.5" font-size="10.78" fill="#fff" xml:space="preserve" transform="rotate(-0.0429 138.2 2558.4)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.09">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.33">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.23">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.18">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.39">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.04">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.50">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.06">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan></text>
<text class="ln" x="138.07" y="2572.07" data-r="2256.5" font-size="10.41" fill="#fff" xml:space="preserve" transform="rotate(-0.0238 138.1 2572.1)"><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.06">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.20">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.62">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.45">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.05">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.11">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.76">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.55">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.07">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.29">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.05">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-1.02">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan></text>
<text class="ln" x="144.82" y="2585.97" data-r="2253.0" font-size="10.03" fill="#fff" xml:space="preserve" transform="rotate(0.0064 144.8 2586.0)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.22">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.16">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.33">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.60">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.71">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.08">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.04">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.18">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.04">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.44">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.58">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan></text>
<text class="ln" x="138.32" y="2599.86" data-r="2257.4" font-size="10.48" fill="#fff" xml:space="preserve" transform="rotate(0.0191 138.3 2599.9)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.29">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.38">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.45">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.15">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.30">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.39">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.42">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.20">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.40">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.72">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', seri span><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.35">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.26">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.23">γένοι᾽ οἷος ἐσσὶ μαθών</tspan></text>
<text class="ln" x="140.26" y="2669.75" data-r="2258.1" font-size="10.04" fill="#fff" xml:space="preserve" transform="rotate(0.0080 140.3 2669.8)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.37">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.18">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.30">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.85">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.56">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.44">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.21">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.43">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.17">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.29">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.42">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan></text>
<text class="ln" x="139.62" y="2684.30" data-r="2252.5" font-size="10.05" fill="#fff" xml:space="preserve" transform="rotate(0.0047 139.6 2684.3)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.22">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.23">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.06">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.09">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.25">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.15">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.18">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.38">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.18">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.36">This above all: to thine own self be true,</tspan></text>
<text class="ln" x="142.45" y="2697.65" data-r="2256.9" font-size="10.49" fill="#fff" xml:space="preserve" transform="rotate(-0.0198 142.4 2697.7)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.19">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.63">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.26">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.53">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.24">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.33">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.22">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.15">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.22">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.04">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.30">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.45">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan></text>
<text class="ln" x="141.87" y="2712.18" data-r="2253.1" font-size="10.51" fill="#fff" xml:space="preserve" transform="rotate(0.0051 141.9 2712.2)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.03">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.46">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.28">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.28">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.06">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.72">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.95">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-1.05">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.57">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan></text>
