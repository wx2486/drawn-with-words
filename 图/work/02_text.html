<text class="ln" x="142.76" y="2740.19" data-r="2259.1" font-size="10.78" fill="#fff" xml:space="preserve" transform="rotate(-0.0071 142.8 2740.2)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.12">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.03">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.28">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.22">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.06">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.84">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.22">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.54">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.65">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.06">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.23">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.27">天生我材必有用，千金散尽还复来。</tspan></text>
<text class="ln" x="140.44" y="2754.59" data-r="2253.5" font-size="10.89" fill="#fff" xml:space="preserve" transform="rotate(0.0398 140.4 2754.6)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.03">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.44">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.59">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.30">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.61">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.15">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.48">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.45">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.76">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.11">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.14">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.13">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.08">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.04">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.16">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.43">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan></text>
<text class="ln" x="140.11" y="2767.99" data-r="2252.2" font-size="10.25" fill="#fff" xml:space="preserve" transform="rotate(0.0112 140.1 2768.0)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.24">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.28">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.14">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="-0.13">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.16">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.07">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.10">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.36">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.18">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.31">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan></text>
<text class="ln" x="143.62" y="2781.51" data-r="2257.5" font-size="10.03" fill="#fff" xml:space="preserve" transform="rotate(-0.0079 143.6 2781.5)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.24">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.11">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.01">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.11">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.20">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.29">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.43">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.03">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.25">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.11">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.11">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.07">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.16">To be, or not to be, that is the question:</tspan></text>
<text class="ln" x="139.48" y="2796.57" data-r="2251.6" font-size="10.52" fill="#fff" xml:space="preserve" transform="rotate(-0.0103 139.5 2796.6)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.09">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.11">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.34">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.42">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.29">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.15">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.78">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.10">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.24">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.40">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.51">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.26">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.19">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.15">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.11">Le moi est haïssable.</tspan></text>
<text class="ln" x="143.43" y="2809.38" data-r="2257.0" font-size="10.13" fill="#fff" xml:space="preserve" transform="rotate(0.0382 143.4 2809.4)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.59">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.59">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.15">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.49">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.80">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.40">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.33">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.23">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.19">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.04">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.07">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.23">This above all: to thine own self be true,</tspan></text>
<text class="ln" x="139.98" y="2824.44" data-r="2258.1" font-size="10.27" fill="#fff" xml:space="preserve" transform="rotate(-0.0040 140.0 2824.4)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.47">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.38">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.27">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.33">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.37">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.30">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.27">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan></text>
<text class="ln" x="144.63" y="2838.81" data-r="2257.0" font-size="10.77" fill="#fff" xml:space="preserve" transform="rotate(0.0283 144.6 2838.8)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.06">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.14">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.19">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.57">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.84">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.31">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.55">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.72">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.35">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.47">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.39">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan></text>
<text class="ln" x="142.60" y="2852.03" data-r="2258.1" font-size="10.87" fill="#fff" xml:space="preserve" transform="rotate(0.0690 142.6 2852.0)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.48">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.91">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-1.01">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.04">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.83">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.33">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.05">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.24">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.38">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.34">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.52">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.26">我思故我在。</tspan></text>
<text class="ln" x="142.61" y="2866.03" data-r="2255.9" font-size="10.39" fill="#fff" xml:space="preserve" transform="rotate(0.0049 142.6 2866.0)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.18">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.51">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.49">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.16">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.40">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.05">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.28">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.13">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="-0.35">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.35">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.23">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.36">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.16">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.26">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.18">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan></text>
<text class="ln" x="138.58" y="2879.94" data-r="2252.8" font-size="10.83" fill="#fff" xml:space="preserve" transform="rotate(-0.0116 138.6 2879.9)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.01">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.14">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.15">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.01">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.33">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.17">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.31">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.27">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.60">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.15">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.40">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.14">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.01">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.51">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.29">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.43">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan></text>
<text class="ln" x="143.41" y="2893.97" data-r="2254.3" font-size="10.10" fill="#fff" xml:space="preserve" transform="rotate(0.0071 143.4 2894.0)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.34">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.61">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.64">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.09">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.34">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.16">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.26">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.13">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.14">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.29">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.45">तत् त्वम् असि</tspan></text>
<text class="ln" x="139.34" y="2908.49" data-r="2254.5" font-size="10.45" fill="#fff" xml:space="preserve" transform="rotate(-0.0178 139.3 2908.5)"><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="-0.07">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.34">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.07">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.80">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.05">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.58">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.66">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.66">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.30">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.14">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.02">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.73">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan></text>
<text class="ln" x="139.04" y="2921.93" data-r="2259.6" font-size="10.60" fill="#fff" xml:space="preserve" transform="rotate(-0.0046 139.0 2921.9)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.02">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.28">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.44">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.46">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.33">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.47">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.43">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.39">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan></text>
<text class="ln" x="141.38" y="2936.29" data-r="2255.5" font-size="10.49" fill="#fff" xml:space="preserve" transform="rotate(-0.0655 141.4 2936.3)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.31">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.82">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.49">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.38">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.21">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.04">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.05">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.17">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan></text>
<text class="ln" x="143.42" y="2950.54" data-r="2254.7" font-size="10.03" fill="#fff" xml:space="preserve" transform="rotate(0.0092 143.4 2950.5)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.09">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.21">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="-0.27">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.66">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.56">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.07">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.09">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.31">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.18">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.35">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-1.21">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="1.18">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.48">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.33">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.99">I celebrate myself, and sing myself,</tspan></text>
<text class="ln" x="140.98" y="2964.39" data-r="2253.7" font-size="10.98" fill="#fff" xml:space="preserve" transform="rotate(-0.0253 141.0 2964.4)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.02">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.59">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.20">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.48">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.20">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.10">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.27">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.05">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.17">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.16">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.15">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.05">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.04">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.03">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.40">Je suis moi-même la matière de mon livre.</tspan></text>
<text class="ln" x="138.30" y="2978.52" data-r="2252.1" font-size="10.32" fill="#fff" xml:space="preserve" transform="rotate(0.0031 138.3 2978.5)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.34">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.37">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="-0.08">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.26">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.34">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.36">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.51">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.45">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.14">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.16">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.27">不识庐山真面目，只缘身在此山中。</tspan></text>
<text class="ln" x="143.77" y="2992.63" data-r="2251.5" font-size="10.35" fill="#fff" xml:space="preserve" transform="rotate(0.0091 143.8 2992.6)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.13">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.27">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.46">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.55">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.10">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.52">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.23">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.04">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.03">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.01">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.17">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.16">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.24">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.00">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.37">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.35">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan></text>
<text class="ln" x="140.49" y="3006.57" data-r="2255.5" font-size="10.24" fill="#fff" xml:space="preserve" transform="rotate(-0.0266 140.5 3006.6)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.36">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.23">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.61">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.14">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.37">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.61">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.04">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.37">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.19">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan></text>
<text class="ln" x="139.60" y="3020.59" data-r="2254.4" font-size="10.47" fill="#fff" xml:space="preserve" transform="rotate(-0.0057 139.6 3020.6)"><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.40">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.64">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.21">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.61">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-1.12">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.08">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.35">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.09">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.56">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.37">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.24">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan></text>
<text class="ln" x="144.45" y="3034.66" data-r="2258.5" font-size="10.78" fill="#fff" xml:space="preserve" transform="rotate(-0.0007 144.4 3034.7)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.79">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.69">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.00">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.21">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.14">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.13">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="-0.45">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.77">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.44">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.36">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.71">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan></text>
<text class="ln" x="143.51" y="3047.98" data-r="2252.7" font-size="10.33" fill="#fff" xml:space="preserve" transform="rotate(0.0206 143.5 3048.0)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.46">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.71">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.11">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.12">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.34">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.33">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.62">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.15">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan></text><script><![CDATA[
(function(){
function run(){
  var lines = document.querySelectorAll('text.ln');
  for (var li = 0; li < lines.length; li++) {
    var t = lines[li];
    var lim = parseFloat(t.getAttribute('data-r'));
    var spans = t.querySelectorAll('tspan');
    var cutAt = -1;
    for (var i = 0; i < spans.length; i++) {
      var s = spans[i];
      var n = s.getNumberOfChars();
      if (!n) continue;
      var e0 = s.getExtentOfChar(0), e1 = s.getExtentOfChar(n - 1);
      var r = Math.max(e0.x + e0.width, e1.x + e1.width);
      if (r <= lim) continue;
      var lang = s.getAttribute('data-l');
      cutAt = i;
      if (lang === 'zh' || lang === 'ja' || lang === 'lat') {
        var k = 0;
        while (k < n) { var e = s.getExtentOfChar(k); if (e.x + e.width > lim) break; k++; }
        var txt = s.textContent, keep = k;
        if (lang === 'lat' && txt.charAt(k) !== ' ') {
          var sp = txt.lastIndexOf(' ', k - 1);
          keep = sp > 0 ? sp : 0;
        }
        txt = txt.slice(0, keep).replace(/[\s,;:]+$/, '');
        if (txt.length > 1) { s.textContent = txt; cutAt = i + 1; }
      }
      break;
    }
    if (cutAt >= 0) {
      for (var j = spans.length - 1; j >= cutAt; j--) spans[j].remove();
      var rem = t.querySelectorAll('tspan');
      var last = rem[rem.length - 1];
      if (last && last.getAttribute('data-l') === 'sep') last.remove();
    }
  }
  document.documentElement.setAttribute('data-done', '1');
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(run); else run();
})();
]]></script>
