<text class="ln" x="139.01" y="1745.36" data-r="2257.7" font-size="10.09" fill="#fff" xml:space="preserve" transform="rotate(-0.0085 139.0 1745.4)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.54">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.62">Trust thyself: every heart vibrates to that iron string.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.18">Zwei Seelen wohnen, ach! in meiner Brust,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.60">Werde, der du bist.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.15">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.04">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.48">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.21">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.25">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="-0.17">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan></text>
<text class="ln" x="138.86" y="1760.84" data-r="2254.7" font-size="10.35" fill="#fff" xml:space="preserve" transform="rotate(-0.0216 138.9 1760.8)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.27">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.62">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.25">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.87">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.13">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.44">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.17">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.00">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.14">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.54">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.07">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.66">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.87">To be, or not to be, that is the question:</tspan></text>
<text class="ln" x="141.42" y="1774.55" data-r="2252.1" font-size="10.71" fill="#fff" xml:space="preserve" transform="rotate(0.0011 141.4 1774.5)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.02">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.65">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.80">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.20">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.33">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.40">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.20">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.68">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.36">Que sais-je ?</tspan><tspan data-l="sep" font-family <text class="ln" x="138.86" y="1788.93" data-r="2255.2" font-size="10.79" fill="#fff" xml:space="preserve" transform="rotate(-0.0352 138.9 1788.9)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.39">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.63">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.06">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.13">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.55">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.55">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.55">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.89">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.40">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.27">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan></text>

<text class="ln" x="142.36" y="1843.89" data-r="2251.2" font-size="10.07" fill="#fff" xml:space="preserve" transform="rotate(0.0119 142.4 1843.9)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.32">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.07">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.07">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.16">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.28">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.46">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.51">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.48">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.28">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.41">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.21">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.05">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.51">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.04">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.35">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.36">Je suis moi-même la matière de mon livre.</tspan></text>
<text class="ln" x="142.40" y="1857.91" data-r="2258.7" font-size="10.18" fill="#fff" xml:space="preserve" transform="rotate(0.0488 142.4 1857.9)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.41">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.26">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.14">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="-0.12">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.48">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.41">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.04">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.02">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.46">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.32">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.41">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.65">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.01">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.36">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.36">Je est un autre.</tspan></text>
<text class="ln" x="140.20" y="1871.99" data-r="2253.2" font-size="11.00" fill="#fff" xml:space="preserve" transform="rotate(-0.0584 140.2 1872.0)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.55">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.78">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.49">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.06">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.46">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.60">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.40">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.12">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.13">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan></text>
<text class="ln" x="144.01" y="1886.10" data-r="2253.5" font-size="10.10" fill="#fff" xml:space="preserve" transform="rotate(0.0111 144.0 1886.1)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.53">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.21">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.29">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.32">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.35">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.33">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.02">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.11">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.05">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.06">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan></text>

<text class="ln" x="143.34" y="1914.28" data-r="2256.5" font-size="10.51" fill="#fff" xml:space="preserve" transform="rotate(0.0172 143.3 1914.3)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.26">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.26">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.65">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.48">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.14">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.26">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.11">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.41">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.10">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.25">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.19">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.19">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.01">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.16">Je est un autre.</tspan></text>
<text class="ln" x="144.02" y="1927.51" data-r="2256.3" font-size="10.85" fill="#fff" xml:space="preserve" transform="rotate(-0.0296 144.0 1927.5)"><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.48">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.62">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.24">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.25">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.05">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.33">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.13">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.26">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.06">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.31">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.29">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.01">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan></text>
<text class="ln" x="143.62" y="1942.09" data-r="2252.7" font-size="10.51" fill="#fff" xml:space="preserve" transform="rotate(0.0220 143.6 1942.1)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.05">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.20">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.81">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.31">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.40">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.34">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.79">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.54">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.19">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.70">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.91">不识庐山真面目，只缘身在此山中。</tspan></text>
<text class="ln" x="142.99" y="1955.50" data-r="2253.0" font-size="10.54" fill="#fff" xml:space="preserve" transform="rotate(-0.0260 143.0 1955.5)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.23">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.37">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.08">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.03">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.25">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.23">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.17">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.05">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.34">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.11">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.16">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.13">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="-0.14">吾輩は猫である。名前はまだ無い。</tspan></text>
<text class="ln" x="140.90" y="1970.10" data-r="2257.6" font-size="10.73" fill="#fff" xml:space="preserve" transform="rotate(-0.0012 140.9 1970.1)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.38">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="-0.66">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.48">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.05">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.12">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.26">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.20">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.14">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.35">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.22">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.03">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.27">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.56">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.85">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="1.15">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.91">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan></text>

y="-0.17">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.10">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.30">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.07">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.30">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan></text>
<text class="ln" x="140.33" y="1997.56" data-r="2258.4" font-size="10.03" fill="#fff" xml:space="preserve" transform="rotate(-0.0179 140.3 1997.6)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.56">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.36">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.28">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.25">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.25">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.11">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.21">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.57">我见青山多妩媚，料青山见我应如是。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.40">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.31">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.15">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.12">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan></text>

ew Roman', serif" dy="0.28">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.04">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.00">mihi quaestio factus sum</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.36">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.30">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.39">Je suis moi-même la matière de mon livre.</tspan></text>
<text class="ln" x="138.25" y="2026.46" data-r="2253.8" font-size="10.47" fill="#fff" xml:space="preserve" transform="rotate(0.0141 138.3 2026.5)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.36">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.44">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.18">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.18">Le moi est haïssable.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.48">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.38">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.54">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.23">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.39">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.02">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.02">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.26">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan></text>

span><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="-0.77">吾輩は猫である。名前はまだ無い。</tspan></text>
<text class="ln" x="142.42" y="2054.04" data-r="2253.3" font-size="10.24" fill="#fff" xml:space="preserve" transform="rotate(-0.0180 142.4 2054.0)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.03">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="-0.11">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.35">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.12">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.23">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.40">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.37">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.68">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.22">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.41">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.14">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.25">吾生也有涯，而知也无涯。</tspan></text>

iore homine habitat veritas.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.44">Je pense, donc je suis.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.61">Je suis moi-même la matière de mon livre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.23">Que sais-je ?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.18">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.03">Le moi est haïssable.</tspan></text>
<text class="ln" x="138.22" y="2082.01" data-r="2251.4" font-size="10.67" fill="#fff" xml:space="preserve" transform="rotate(-0.0281 138.2 2082.0)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.42">Yo sé quién soy.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.96">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.60">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.05">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="he" font-family="'Times New Roman', 'Segoe UI'" dy="0.49">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="-0.21">अहं ब्रह्मास्मि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.01">तत् त्वम् असि</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="hi" font-family="'Nirmala UI'" dy="0.29">कोऽहम्</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.39">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.14">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan></text>
<text class="ln" x="143.30" y="2096.66" data-r="2257.7" font-size="10.49" fill="#fff" xml:space="preserve" transform="rotate(-0.0177 143.3 2096.7)"><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.11">Je est un autre.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.04">I celebrate myself, and sing myself,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.03">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.31">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.30">To be, or not to be, that is the question:</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.27">This above all: to thine own self be true,</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.52">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.77">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.08">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan></text>
<text class="ln" x="140.99" y="2109.59" data-r="2256.1" font-size="10.59" fill="#fff" xml:space="preserve" transform="rotate(-0.0090 141.0 2109.6)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.53">举杯邀明月，对影成三人。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.06">问君何能尔？心远地自偏。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.69">天生我材必有用，千金散尽还复来。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.02">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.11">我思故我在。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="ja" font-family="'Noto Serif SC'" dy="0.00">吾輩は猫である。名前はまだ無い。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.38">γνῶθι σεαυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="0.14">ἐδιζησάμην ἐμεωυτόν</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.40">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="lat" font-family="Cambria, Georgia, 'Times New Roman', serif" dy="-0.23">Cogito, ergo sum.</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan> <text class="ln" x="138.96" y="2123.79" data-r="2251.1" font-size="10.11" fill="#fff" xml:space="preserve" transform="rotate(-0.0287 139.0 2123.8)"><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.17">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.45">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.06">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.65">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-1.33">不识庐山真面目，只缘身在此山中。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="1.19">路漫漫其修远兮，吾将上下而求索。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.01">吾生也有涯，而知也无涯。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.38">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="0.39">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan data-l="sep" font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan data-l="zh" font-family="'Noto Serif SC'" dy="-0.26">人生天地之间，若白驹之过郤，忽然而已。</tspan></text>
