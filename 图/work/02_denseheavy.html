<text x="343.96" y="577.03" font-size="10.48" font-weight="900" fill="#fff" xml:space="preserve" transform="rotate(-0.0165 344.0 577.0)"><tspan font-family="'Noto Serif SC'" dy="-0.10">吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.35">知人者智，自知者明。胜人者有力，自胜者强。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="-0.50">不识庐山真面目，只缘身在此山中。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.03">路漫漫其修远兮，吾将上下而求索。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="-0.19">吾生也有涯，而知也无涯。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.33">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.36">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan></text>

<text x="347.56" y="608.59" font-size="10.49" font-weight="900" fill="#fff" xml:space="preserve" transform="rotate(0.0075 347.6 608.6)"><tspan font-family="'Noto Serif SC'" dy="-0.01">吾輩は猫である。名前はまだ無い。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.18">γνῶθι σεαυτόν</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.42">ἐδιζησάμην ἐμεωυτόν</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.06">γένοι᾽ οἷος ἐσσὶ μαθών</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.47">Cogito, ergo sum.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.47">mihi quaestio factus sum</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.20">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.07">Je pense, donc je suis.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.35">Je suis moi-même la matière de mon livre.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.23">Que sais-je ?</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.50">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan></text>
<text x="349.28" y="619.01" font-size="10.58" font-weight="900" fill="#fff" xml:space="preserve" transform="rotate(-0.0341 349.3 619.0)"><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.07">Nel mezzo del cammin di nostra vita mi ritrovai per una selva oscura,</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.05">Yo sé quién soy.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.32">Não sou nada. Nunca serei nada. Não posso querer ser nada. À parte isso, tenho em mim todos os sonhos do mundo.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.30">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.45">Selvet er et Forhold, der forholder sig til sig selv.</tspan></text>
<text x="335.94" y="630.04" font-size="10.16" font-weight="900" fill="#fff" xml:space="preserve" transform="rotate(-0.0072 335.9 630.0)"><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.28">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.27">To be, or not to be, that is the question:</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.12">This above all: to thine own self be true,</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.29">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.17">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.35">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan></text>

<text x="323.01" y="736.54" font-size="10.22" font-weight="900" fill="#fff" xml:space="preserve" transform="rotate(0.0139 323.0 736.5)"><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.00">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.09">Je pense, donc je suis.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.15">Je suis moi-même la matière de mon livre.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.03">Que sais-je ?</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.35">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.29">Le moi est haïssable.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.11">Je est un autre.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.08">I celebrate myself, and sing myself,</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.39">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan></text>
<text x="317.06" y="747.70" font-size="10.39" font-weight="900" fill="#fff" xml:space="preserve" transform="rotate(0.0009 317.1 747.7)"><tspan font-family="'Noto Serif SC'" dy="0.26">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="-0.24">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.03">我见青山多妩媚，料青山见我应如是。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.15">举杯邀明月，对影成三人。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="-0.37">问君何能尔？心远地自偏。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.02">天生我材必有用，千金散尽还复来。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.08">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.36">我思故我在。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="-0.29">吾輩は猫である。名前はまだ無い。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.14">γνῶθι σεαυτόν</tspan></text>
<text x="310.14" y="758.47" font-size="10.09" font-weight="900" fill="#fff" xml:space="preserve" transform="rotate(-0.0166 310.1 758.5)"><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.04">To be, or not to be, that is the question:</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.03">This above all: to thine own self be true,</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.03">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.16">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.45">I am certain of nothing but of the holiness of the Heart&#x27;s affections and the truth of Imagination.</tspan></text>

<text x="346.02" y="2148.80" font-size="10.09" font-weight="900" fill="#fff" xml:space="preserve" transform="rotate(-0.0103 346.0 2148.8)"><tspan font-family="'Noto Serif SC'" dy="0.16">吾生也有涯，而知也无涯。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="-0.36">吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.22">既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="-0.29">人生天地之间，若白驹之过郤，忽然而已。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.24">我见青山多妩媚，料青山见我应如是。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.12">举杯邀明月，对影成三人。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.29">问君何能尔？心远地自偏。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="-0.42">天生我材必有用，千金散尽还复来。</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="-0.00">在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。</tspan></text>
<text x="332.29" y="2158.80" font-size="10.06" font-weight="900" fill="#fff" xml:space="preserve" transform="rotate(0.0079 332.3 2158.8)"><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.03">Noli foras ire, in te ipsum redi; in interiore homine habitat veritas.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.16">Je pense, donc je suis.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.10">Je suis moi-même la matière de mon livre.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.66">Que sais-je ?</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.51">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.11">Le moi est haïssable.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.17">Je est un autre.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.06">I celebrate myself, and sing myself,</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.13">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan></text>

<text x="341.55" y="2416.15" font-size="10.51" font-weight="900" fill="#fff" xml:space="preserve" transform="rotate(0.0272 341.6 2416.2)"><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.13">L&#x27;homme n&#x27;est qu&#x27;un roseau, le plus faible de la nature ; mais c&#x27;est un roseau pensant.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.10">Le moi est haïssable.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.25">Je est un autre.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.71">I celebrate myself, and sing myself,</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.38">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.51">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.54">To be, or not to be, that is the question:</tspan></text>
<text x="323.13" y="2426.83" font-size="10.19" font-weight="900" fill="#fff" xml:space="preserve" transform="rotate(-0.0032 323.1 2426.8)"><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.35">I celebrate myself, and sing myself,</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.04">Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.)</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.57">I&#x27;m Nobody! Who are you? Are you, Nobody, too?</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.18">To be, or not to be, that is the question:</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.18">This above all: to thine own self be true,</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.38">Who in the world am I? Ah, that&#x27;s the great puzzle!</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.27">I never can catch myself at any time without a perception, and never can observe any thing but the perception.</tspan></text>
<text x="327.94" y="2436.84" font-size="10.58" font-weight="900" fill="#fff" xml:space="preserve" transform="rotate(-0.0010 327.9 2436.8)"><tspan font-family="'Noto Serif SC', Cambria, serif" dy="0.34">Я человек больной... Я злой человек. Непривлекательный я человек.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC', Cambria, serif" dy="-0.36">Selvet er et Forhold, der forholder sig til sig selv.</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Times New Roman'" dy="-0.28">אם אין אני לי, מי לי? וכשאני לעצמי, מה אני? ואם לא עכשיו, אימתי?</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Nirmala UI'" dy="0.34">अहं ब्रह्मास्मि</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Nirmala UI'" dy="0.14">तत् त्वम् असि</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Nirmala UI'" dy="-0.34">कोऽहम्</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.13">昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？</tspan><tspan font-family="'Noto Serif SC'"> · </tspan><tspan font-family="'Noto Serif SC'" dy="0.13">子非鱼，安知鱼之乐？子非我，安知我不知鱼之乐？</tspan></text></g>
