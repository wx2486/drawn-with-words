<text font-size="45.161" fill="#fff" xml:space="preserve"><textPath href="#L0" startOffset="38.8"><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Exultation is the going of an inland soul to sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海上生明月，天涯共此时。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。</tspan></textPath></text>
<text font-size="43.846" fill="#fff" xml:space="preserve"><textPath href="#L1" startOffset="71.8"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La chair est triste, hélas ! et j&#x27;ai lu tous les livres.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >东临碣石，以观沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan></textPath></text>
<text font-size="42.569" fill="#fff" xml:space="preserve"><textPath href="#L2" startOffset="56.5"><tspan font-family="'Noto Serif SC'" >天下之水，莫大于海：万川归之，不知何时止而不盈。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer !</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La mer, la mer, toujours recommencée</tspan></textPath></text>
<text font-size="41.329" fill="#fff" xml:space="preserve"><textPath href="#L3" startOffset="70.9"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Listen! you hear the grating roar of pebbles which the waves draw back, and fling,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >荒海や佐渡によこたふ天河</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Listen! you hear the grating roar of pebbles which the waves draw back, and fling,</tspan></textPath></text>
<text font-size="40.125" fill="#fff" xml:space="preserve"><textPath href="#L4" startOffset="24.7"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Per correr miglior acque alza le vele omai la navicella del mio ingegno,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >百川东到海，何时复西归？</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >e il naufragar m&#x27;è dolce in questo mare.</tspan></textPath></text>
<text font-size="38.957" fill="#fff" xml:space="preserve"><textPath href="#L5" startOffset="68.9"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Прощай, свободная стихия! В последний раз передо мной ты катишь волны голубые</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >白日依山尽，黄河入海流。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Alone, alone, all, all alone, alone on a wide wide sea!</tspan></textPath></text>
<text font-size="37.822" fill="#fff" xml:space="preserve"><textPath href="#L6" startOffset="69.5"><tspan font-family="'Noto Serif SC'" >东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Ó mar salgado, quanto do teu sal são lágrimas de Portugal!</tspan></textPath></text>
<text font-size="36.720" fill="#fff" xml:space="preserve"><textPath href="#L7" startOffset="66.3"><tspan font-family="'Noto Serif SC'" >曾经沧海难为水，除却巫山不是云。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海日生残夜，江春入旧年。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La chair est triste, hélas ! et j&#x27;ai lu tous les livres. Fuir ! là-bas fuir !</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春の海終日のたりのたりかな</tspan></textPath></text>
<text font-size="35.651" fill="#fff" xml:space="preserve"><textPath href="#L8" startOffset="6.1"><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Out of the cradle endlessly rocking,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >It keeps eternal whisperings around desolate shores,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλασσα ὕδωρ καθαρώτατον καὶ μιαρώτατον</tspan></textPath></text>
<text font-size="34.612" fill="#fff" xml:space="preserve"><textPath href="#L9" startOffset="81.9"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >כל הנחלים הולכים אל הים והים איננו מלא</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Tiefe Stille herrscht im Wasser, ohne Regung ruht das Meer,</tspan></textPath></text>
<text font-size="33.604" fill="#fff" xml:space="preserve"><textPath href="#L10" startOffset="48.5"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Break, break, break, on thy cold gray stones, O Sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The world below the brine, forests at the bottom of the sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Water, water, every where, nor any drop to drink.</tspan></textPath></text>
<text font-size="32.625" fill="#fff" xml:space="preserve"><textPath href="#L11" startOffset="22.2"><tspan font-family="'Times New Roman', 'Segoe UI'" >شب تاریک و بیم موج و گردابی چنین هایل، کجا دانند حال ما سبکباران ساحل‌ها</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Elle est retrouvée. Quoi ? L&#x27;Éternité. C&#x27;est la mer allée avec le soleil.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >My soul is full of longing for the secret of the Sea,</tspan></textPath></text>
<text font-size="31.675" fill="#fff" xml:space="preserve"><textPath href="#L12" startOffset="34.4"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The deepest known point of the ocean lies nearly eleven kilometres down.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan></textPath></text>
<text font-size="30.753" fill="#fff" xml:space="preserve"><textPath href="#L13" startOffset="39.8"><tspan font-family="'Noto Serif SC'" >北冥有鱼，其名为鲲。鲲之大，不知其几千里也。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >长风破浪会有时，直挂云帆济沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan></textPath></text>
<text font-size="29.857" fill="#fff" xml:space="preserve"><textPath href="#L14" startOffset="38.6"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer ! La mer est ton miroir ; tu contemples ton âme</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >精卫衔微木，将以填沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >and darkness was upon the face of the deep.</tspan></textPath></text>
<text font-size="28.987" fill="#fff" xml:space="preserve"><textPath href="#L15" startOffset="18.0"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La mer, la mer, toujours recommencée</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >潮汐主要由月球和太阳的引力引起。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >荒海や佐渡によこたふ天河</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Por mares nunca de antes navegados</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Белеет парус одинокой в тумане моря голубом!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Nuestras vidas son los ríos que van a dar en la mar, que es el morir;</tspan></textPath></text>
<text font-size="28.143" fill="#fff" xml:space="preserve"><textPath href="#L16" startOffset="18.6"><tspan font-family="'Noto Serif SC'" >天下之水，莫大于海：万川归之，不知何时止而不盈；尾闾泄之，不知何时已而不虚。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >小舟从此逝，江海寄余生。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Exultation is the going of an inland soul to sea, past the houses, past the headlands, into deep Eternity.</tspan></textPath></text>

s vidas son los ríos que van a dar en la mar, que es el morir;</tspan></textPath></text>

<text font-size="8.886" fill="#fff" xml:space="preserve"><textPath href="#L55" startOffset="18.7"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >It keeps eternal whisperings around desolate shores,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Tiefe Stille herrscht im Wasser, ohne Regung ruht das Meer,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Oh ! combien de marins, combien de capitaines qui sont partis joyeux pour des courses lointaines,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >百川东到海，何时复西归？</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Ó mar salgado, quanto do teu sal são lágrimas de Portugal!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Прощай, свободная стихия! В последний раз передо мной ты катишь волны голубые</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >精卫衔微木，将以填沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >and darkness was upon the face of the deep.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >On the seashore of endless worlds children meet.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer ! La mer est ton miroir ; tu contemples ton âme</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La chair est triste, hélas ! et j&#x27;ai lu tous les livres. Fuir ! là-bas fuir !</tspan></textPath></text>
<text font-size="8.627" fill="#fff" xml:space="preserve"><textPath href="#L56" startOffset="4.2"><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλαττα θάλαττα</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >沧海月明珠有泪，蓝田日暖玉生烟。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >君不见黄河之水天上来，奔流到海不复回。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Nuestras vidas son los ríos que van a dar en la mar, que es el morir;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Elle est retrouvée. Quoi ? L&#x27;Éternité. C&#x27;est la mer allée avec le soleil.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Break, break, break, on thy cold gray stones, O Sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海洋覆盖了地球表面约百分之七十一。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >荒海や佐渡によこたふ天河</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Suave, mari magno turbantibus aequora ventis, e terra magnum alterius spectare laborem;</tspan></textPath></text>

<text font-size="7.225" fill="#fff" xml:space="preserve"><textPath href="#L62" startOffset="15.1"><tspan font-family="'Noto Serif SC'" >海上生明月，天涯共此时。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Full fathom five thy father lies; of his bones are coral made; those are pearls that were his eyes:</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Por mares nunca de antes navegados</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >荒海や佐渡によこたふ天河</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Tiefe Stille herrscht im Wasser, ohne Regung ruht das Meer,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >and darkness was upon the face of the deep.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >白日依山尽，黄河入海流。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλασσα ὕδωρ καθαρώτατον καὶ μιαρώτατον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >百川东到海，何时复西归？</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >e il naufragar m&#x27;è dolce in questo mare.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Roll on, thou deep and dark blue Ocean, roll! Ten thousand fleets sweep over thee in vain;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Oh ! combien de marins, combien de capitaines qui sont partis joyeux pour des courses lointaines,</tspan></textPath></text>
<text font-size="7.015" fill="#fff" xml:space="preserve"><textPath href="#L63" startOffset="4.5"><tspan font-family="'Noto Serif SC'" >海日生残夜，江春入旧年。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >and darkness was upon the face of the deep.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Tiefe Stille herrscht im Wasser, ohne Regung ruht das Meer,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The deepest known point of the ocean lies nearly eleven kilometres down.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The world below the brine, forests at the bottom of the sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Alone, alone, all, all alone, alone on a wide wide sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >e il naufragar m&#x27;è dolce in questo mare.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλαττα θάλαττα</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La mer, la mer, toujours recommencée</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >כל הנחלים הולכים אל הים והים איננו מלא</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >长风破浪会有时，直挂云帆济沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >精卫衔微木，将以填沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Per correr miglior acque alza le vele omai la navicella del mio ingegno,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Break, break, break, on thy cold gray stones, O Sea!</tspan></textPath></text>
<text font-size="6.811" fill="#fff" xml:space="preserve"><textPath href="#L64" startOffset="1.6"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The sea is calm to-night. The tide is full, the moon lies fair upon the straits;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Белеет парус одинокой в тумане моря голубом!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >曾经沧海难为水，除却巫山不是云。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Nuestras vidas son los ríos que van a dar en la mar, que es el morir;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >潮汐主要由月球和太阳的引力引起。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海日生残夜，江春入旧年。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >天下之水，莫大于海：万川归之，不知何时止而不盈；尾闾泄之，不知何时已而不虚。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Below about a thousand metres, no sunlight reaches the water.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer ! La mer est ton miroir ; tu contemples ton âme</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλασσα ὕδωρ καθαρώτατον καὶ μιαρώτατον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Out of the cradle endlessly rocking,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Suave, mari magno turbantibus aequora ventis, e terra magnum alterius spectare laborem;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Exultation is the going of an inland soul to sea, past the houses, past the headlands, into deep Eternity.</tspan></textPath></text>
<text font-size="6.612" fill="#fff" xml:space="preserve"><textPath href="#L65" startOffset="9.7"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Yes, as every one knows, meditation and water are wedded for ever.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Water, water, every where, nor any drop to drink.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >白日依山尽，黄河入海流。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >It keeps eternal whisperings around desolate shores,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Прощай, свободная стихия! В последний раз передо мной ты катишь волны голубые</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Por mares nunca de antes navegados</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I started Early, took my Dog, and visited the Sea;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >百川东到海，何时复西归？</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Oh ! combien de marins, combien de capitaines qui sont partis joyeux pour des courses lointaines,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family= /tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >百川东到海，何时复西归？</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >白日依山尽，黄河入海流。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >北冥有鱼，其名为鲲。鲲之大，不知其几千里也。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The sea is calm to-night. The tide is full, the moon lies fair upon the straits;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >曾经沧海难为水，除却巫山不是云。</tspan></textPath></text>
<text font-size="6.051" fill="#fff" xml:space="preserve"><textPath href="#L68" startOffset="11.8"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Tiefe Stille herrscht im Wasser, ohne Regung ruht das Meer,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The world below the brine, forests at the bottom of the sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Alone, alone, all, all alone, alone on a wide wide sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Below about a thousand metres, no sunlight reaches the water.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I started Early, took my Dog, and visited the Sea;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Por mares nunca de antes navegados</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The deepest known point of the ocean lies nearly eleven kilometres down.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Suave, mari magno turbantibus aequora ventis, e terra magnum alterius spectare laborem;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >精卫衔微木，将以填沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλαττα θάλαττα</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Прощай, свободная стихия! В последний раз передо мной ты катишь волны голубые</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Water, water, every where, nor any drop to drink.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Full fathom five thy father lies; of his bones are coral made; those are pearls that were his eyes:</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan></textPath></text>
<text font-size="5.875" fill="#fff" xml:space="preserve"><textPath href="#L69" startOffset="6.8"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer ! La mer est ton miroir ; tu contemples ton âme</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >小舟从此逝，江海寄余生。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La chair est triste, hélas ! et j&#x27;ai lu tous les livres. Fuir ! là-bas fuir !</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春の海終日のたりのたりかな</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >My soul is full of longing for the secret of the Sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >شب تاریک و بیم موج و گردابی چنین هایل، کجا دانند حال ما سبکباران ساحل‌ها</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Exultation is the going of an inland soul to sea, past the houses, past the headlands, into deep Eternity.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海日生残夜，江春入旧年。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >כל הנחלים הולכים אל הים והים איננו מלא</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Roll on, thou deep and dark blue Ocean, roll! Ten thousand fleets sweep over thee in vain;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >荒海や佐渡によこたふ天河</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Out of the cradle endlessly rocking,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >潮汐主要由月球和太阳的引力引起。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Yes, as every one knows, meditation and water are wedded for ever.</tspan></textPath></text>

gno turbantibus aequora ventis, e terra magnum alterius spectare laborem;</tspan></textPath></text>

oman', serif" >My soul is full of longing for the secret of the Sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Break, break, break, on thy cold gray stones, O Sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海日生残夜，江春入旧年。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春の海終日のたりのたりかな</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Nuestras vidas son los ríos que van a dar en la mar, que es el morir;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Oh ! combien de marins, combien de capitaines qui sont partis joyeux pour des courses lointaines,</tspan></textPath></text>
<text font-size="5.220" fill="#fff" xml:space="preserve"><textPath href="#L73" startOffset="5.3"><tspan font-family="'Noto Serif SC'" >小舟从此逝，江海寄余生。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Alone, alone, all, all alone, alone on a wide wide sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer ! La mer est ton miroir ; tu contemples ton âme</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Below about a thousand metres, no sunlight reaches the water.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海洋覆盖了地球表面约百分之七十一。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Elle est retrouvée. Quoi ? L&#x27;Éternité. C&#x27;est la mer allée avec le soleil.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The voice of the sea is seductive; never ceasing, whispering, clamoring, murmuring,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Tiefe Stille herrscht im Wasser, ohne Regung ruht das Meer,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The deepest known point of the ocean lies nearly eleven kilometres down.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλασσα ὕδωρ καθαρώτατον καὶ μιαρώτατον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The voice of the sea is seductive; never ceasing, whispering, clamoring, murmuring,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >כל הנחלים הולכים אל הים והים איננו מלא</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海日生残夜，江春入旧年。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Белеет парус одинокой в тумане моря голубом!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Full fathom five thy father lies; of his bones are coral made; those are pearls that were his eyes:</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >百川东到海，何时复西归？</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >荒海や佐渡によこたふ天河</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Roll on, thou deep and dark blue Ocean, roll! Ten thousand fleets sweep over thee in vain;</tspan></textPath></text>
<text font-size="5.068" fill="#fff" xml:space="preserve"><textPath href="#L74" startOffset="2.0"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La mer, la mer, toujours recommencée</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海上生明月，天涯共此时。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Nuestras vidas son los ríos que van a dar en la mar, que es el morir;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >It keeps eternal whisperings around desolate shores,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春の海終日のたりのたりかな</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La chair est triste, hélas ! et j&#x27;ai lu tous les livres. Fuir ! là-bas fuir !</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >沧海月明珠有泪，蓝田日暖玉生烟。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >My soul is full of longing for the secret of the Sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Water, water, every where, nor any drop to drink.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I started Early, took my Dog, and visited the Sea;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλαττα θάλαττα</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >小舟从此逝，江海寄余生。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The world below the brine, forests at the bottom of the sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Suave, mari magno turbantibus aequora ventis, e terra magnum alterius spectare laborem;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Exultation is the going of an inland soul to sea, past the houses, past the headlands, into deep Eternity.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Break, break, break, on thy cold gray stones, O Sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >e il naufragar m&#x27;è dolce in questo mare.</tspan></textPath></text>
<text font-size="4.920" fill="#fff" xml:space="preserve"><textPath href="#L75" startOffset="3.6"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Alone, alone, all, all alone, alone on a wide wide sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >北冥有鱼，其名为鲲。鲲之大，不知其几千里也。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >白日依山尽，黄河入海流。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Elle est retrouvée. Quoi ? L&#x27;Éternité. C&#x27;est la mer allée avec le soleil.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >曾经沧海难为水，除却巫山不是云。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Per correr miglior acque alza le vele omai la navicella del mio ingegno,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The sea is calm to-night. The tide is full, the moon lies fair upon the straits;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Прощай, свободная стихия! В последний раз передо мной ты катишь волны голубые</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Yes, as every one knows, meditation and water are wedded for ever.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >and darkness was upon the face of the deep.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >君不见黄河之水天上来，奔流到海不复回。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Oh ! combien de marins, combien de capitaines qui sont partis joyeux pour des courses lointaines,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >天下之水，莫大于海：万川归之，不知何时止而不盈；尾闾泄之，不知何时已而不虚。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Out of the cradle endlessly rocking,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Below about a thousand metres, no sunlight reaches the water.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >长风破浪会有时，直挂云帆济沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Ó mar salgado, quanto do teu sal são lágrimas de Portugal!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan></textPath></text>

oto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >曾经沧海难为水，除却巫山不是云。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >沧海月明珠有泪，蓝田日暖玉生烟。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Exultation is the going of an inland soul to sea, past the houses, past the headlands, into deep Eternity.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Por mares nunca de antes navegados</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Yes, as every one knows, meditation and water are wedded for ever.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >כל הנחלים הולכים אל הים והים איננו מלא</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Ó mar salgado, quanto do teu sal são lágrimas de Portugal!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >君不见黄河之水天上来，奔流到海不复回。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >e il naufragar m&#x27;è dolce in questo mare.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Below about a thousand metres, no sunlight reaches the water.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春の海終日のたりのたりかな</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海上生明月，天涯共此时。</tspan></textPath></text>
<text font-size="4.638" fill="#fff" xml:space="preserve"><textPath href="#L77" startOffset="2.9"><tspan font-family="'Noto Serif SC'" >北冥有鱼，其名为鲲。鲲之大，不知其几千里也。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >天下之水，莫大于海：万川归之，不知何时止而不盈；尾闾泄之，不知何时已而不虚。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Alone, alone, all, all alone, alone on a wide wide sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Oh ! combien de marins, combien de capitaines qui sont partis joyeux pour des courses lointaines,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The sea is calm to-night. The tide is full, the moon lies fair upon the straits;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >白日依山尽，黄河入海流。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海洋覆盖了地球表面约百分之七十一。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >My soul is full of longing for the secret of the Sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Per correr miglior acque alza le vele omai la navicella del mio ingegno,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Tiefe Stille herrscht im Wasser, ohne Regung ruht das Meer,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海日生残夜，江春入旧年。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >精卫衔微木，将以填沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >百川东到海，何时复西归？</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer ! La mer est ton miroir ; tu contemples ton âme</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Roll on, thou deep and dark blue Ocean, roll! Ten thousand fleets sweep over thee in vain;</tspan></textPath></text>
<text font-size="4.503" fill="#fff" xml:space="preserve"><textPath href="#L78" startOffset="8.8"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Water, water, every where, nor any drop to drink.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλαττα θάλαττα</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Elle est retrouvée. Quoi ? L&#x27;Éternité. C&#x27;est la mer allée avec le soleil.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Out of the cradle endlessly rocking,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Nuestras vidas son los ríos que van a dar en la mar, que es el morir;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I started Early, took my Dog, and visited the Sea;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >小舟从此逝，江海寄余生。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Break, break, break, on thy cold gray stones, O Sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >It keeps eternal whisperings around desolate shores,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The voice of the sea is seductive; never ceasing, whispering, clamoring, murmuring,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >and darkness was upon the face of the deep.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The deepest known point of the ocean lies nearly eleven kilometres down.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Suave, mari magno turbantibus aequora ventis, e terra magnum alterius spectare laborem;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Белеет парус одинокой в тумане моря голубом!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Прощай, свободная стихия! В последний раз передо мной ты катишь волны голубые</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The world below the brine, forests at the bottom of the sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >On the seashore of endless worlds children meet.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Full fathom five thy father lies; of his bones are coral made; those are pearls that were his eyes:</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >شب تاریک و بیم موج و گردابی چنین هایل، کجا دانند حال ما سبکباران ساحل‌ها</tspan></textPath></text>

a, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer ! La mer est ton miroir ; tu contemples ton âme</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Water, water, every where, nor any drop to drink.</tspan></textPath></text>

  </tspan><tspan font-family="'Noto Serif SC'" >白日依山尽，黄河入海流。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >君不见黄河之水天上来，奔流到海不复回。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >曾经沧海难为水，除却巫山不是云。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Nuestras vidas son los ríos que van a dar en la mar, que es el morir;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >and darkness was upon the face of the deep.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La chair est triste, hélas ! et j&#x27;ai lu tous les livres. Fuir ! là-bas fuir !</tspan><tspan font-family="Cambria, Georgia, 'Times Ne <text font-size="3.884" fill="#fff" xml:space="preserve"><textPath href="#L83" startOffset="2.3"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Suave, mari magno turbantibus aequora ventis, e terra magnum alterius spectare laborem;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >潮汐主要由月球和太阳的引力引起。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Por mares nunca de antes navegados</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Oh ! combien de marins, combien de capitaines qui sont partis joyeux pour des courses lointaines,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Full fathom five thy father lies; of his bones are coral made; those are pearls that were his eyes:</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The voice of the sea is seductive; never ceasing, whispering, clamoring, murmuring,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλασσα ὕδωρ καθαρώτατον καὶ μιαρώτατον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Ó mar salgado, quanto do teu sal são lágrimas de Portugal!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  · an', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >My soul is full of longing for the secret of the Sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >曾经沧海难为水，除却巫山不是云。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >潮汐主要由月球和太阳的引力引起。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Water, water, every where, nor any drop to drink.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer ! La mer est ton miroir ; tu contemples ton âme</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >e il naufragar m&#x27;è dolce in questo mare.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >荒海や佐渡によこたふ天河</tspan></textPath></text>

，若出其里。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >君不见黄河之水天上来，奔流到海不复回。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >On the seashore of endless worlds children meet.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春の海終日のたりのたりかな</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Exultation is the going of an inland soul to sea, past the houses, past the headlands, into deep Eternity.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Per correr miglior acque alza le vele omai la navicella del mio ingegno,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Alone, alone, all, all alone, alone on a wide wide sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Yes, as every one knows, meditation and water are wedded for ever.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan f amily="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer ! La mer est ton miroir ; tu contemples ton âme</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Out of the cradle endlessly rocking,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Por mares nunca de antes navegados</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Alone, alone, all, all alone, alone on a wide wide sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >天下之水，莫大于海：万川归之，不知何时止而不盈；尾闾泄之，不知何时已而不虚。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The deepest known point of the ocean lies nearly eleven kilometres down.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλασσα ὕδωρ καθαρώτατον καὶ μιαρώτατον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >长风破浪会有时，直挂云帆济沧海。</tspan></textPath></text>
<text font-size="3.350" fill="#fff" xml:space="preserve"><textPath href="#L88" startOffset="7.1"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The voice of the sea is seductive; never ceasing, whispering, clamoring, murmuring,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >百川东到海，何时复西归？</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La chair est triste, hélas ! et j&#x27;ai lu tous les livres. Fuir ! là-bas fuir !</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Ó mar salgado, quanto do teu sal são lágrimas de Portugal!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Белеет парус одинокой в тумане моря голубом!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Below about a thousand metres, no sunlight reaches the water.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >It keeps eternal whisperings around desolate shores,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Oh ! combien de marins, combien de capitaines qui sont partis joyeux pour des courses lointaines,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >On the seashore of endless worlds children meet.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >白日依山尽，黄河入海流。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Exultation is the going of an inland soul to sea, past the houses, past the headlands, into deep Eternity.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >曾经沧海难为水，除却巫山不是云。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海洋覆盖了地球表面约百分之七十一。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Белеет парус одинокой в тумане моря голубом!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >e il naufragar m&#x27;è dolce in questo mare.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλαττα θάλαττα</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Roll on, thou deep and dark blue Ocean, roll! Ten thousand fleets sweep over thee in vain;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >荒海や佐渡によこたふ天河</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλασσα ὕδωρ καθαρώτατον καὶ μιαρώτατον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The world below the brine, forests at the bottom of the sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Yes, as every one knows, meditation and water are wedded for ever.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan></textPath></text>
<text font-size="3.253" fill="#fff" xml:space="preserve"><textPath href="#L89" startOffset="3.5"><tspan font-family="'Times New Roman', 'Segoe UI'" >شب تاریک و بیم موج و گردابی چنین هایل، کجا دانند حال ما سبکباران ساحل‌ها</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Прощай, свободная стихия! В последний раз передо мной ты катишь волны голубые</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春の海終日のたりのたりかな</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >כל הנחלים הולכים אל הים והים איננו מלא</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Water, water, every where, nor any drop to drink.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >My soul is full of longing for the secret of the Sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Oh ! combien de marins, combien de capitaines qui sont partis joyeux pour des courses lointaines,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Por mares nunca de antes navegados</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Out of the cradle endlessly rocking,</tspan><tspan font-fam low about a thousand metres, no sunlight reaches the water.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海日生残夜，江春入旧年。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >沧海月明珠有泪，蓝田日暖玉生烟。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Per correr miglior acque alza le vele omai la navicella del mio ingegno,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >潮汐主要由月球和太阳的引力引起。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Alone, alone, all, all alone, alone on a wide wide sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The sea is calm to-night. The tide is full, the moon lies fair upon the straits;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海上生明月，天涯共此时。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >精卫衔微木，将以填沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I started Early, took my Dog, and visited the Sea;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >and darkness was upon the face of the deep.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Break, break, break, on thy cold gray stones, O Sea!</tspa
