or any drop to drink.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >On the seashore of endless worlds children meet.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春の海終日のたりのたりかな</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海日生残夜，江春入旧年。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >潮汐主要由月球和太阳的引力引起。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >小舟从此逝，江海寄余生。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Out of the cradle endlessly rocking,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >白日依山尽，黄河入海流。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Nuestras vidas son los ríos que van a dar en la mar, que es el morir;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La mer, la mer, toujours recommencée</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Roll on, thou deep and dark blue Ocean, roll! Ten thousand fleets sweep over thee in vain;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The voice of the sea is seductive; never ceasing, whispering, clamoring, murmuring,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >כל הנחלים הולכים אל הים והים איננו מלא</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The world below the brine, forests at the bottom of the sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Белеет парус одинокой в тумане моря голубом!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I started Early, took my Dog, and visited the Sea;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλασσα ὕδωρ καθαρώτατον καὶ μιαρώτατον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >北冥有鱼，其名为鲲。鲲之大，不知其几千里也。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Tiefe Stille herrscht im Wasser, ohne Regung ruht das Meer,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Full fathom five thy father lies; of his bones are coral made; those are pearls that were his eyes:</tspan></textPath></text>
<text font-size="3.066" fill="#fff" xml:space="preserve"><textPath href="#L91" startOffset="3.2"><tspan font-family="'Noto Serif SC'" >沧海月明珠有泪，蓝田日暖玉生烟。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >My soul is full of longing for the secret of the Sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >长风破浪会有时，直挂云帆济沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Elle est retrouvée. Quoi ? L&#x27;Éternité. C&#x27;est la mer allée avec le soleil.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >君不见黄河之水天上来，奔流到海不复回。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Exultation is the going of an inland soul to sea, past the houses, past the headlands, into deep Eternity.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >e il naufragar m&#x27;è dolce in questo mare.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >天下之水，莫大于海：万川归之，不知何时止而不盈；尾闾泄之，不知何时已而不虚。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The deepest known point of the ocean lies nearly eleven kilometres down.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Прощай, свободная стихия! В последний раз передо мной ты катишь волны голубые</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海上生明月，天涯共此时。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >曾经沧海难为水，除却巫山不是云。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλαττα θάλαττα</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Por mares nunca de antes navegados</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The sea is calm to-night. The tide is full, the moon lies fair upon the straits;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海洋覆盖了地球表面约百分之七十一。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Break, break, break, on thy cold gray stones, O Sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Ó mar salgado, quanto do teu sal são lágrimas de Portugal!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Yes, as every one knows, meditation and water are wedded for ever.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La chair est triste, hélas ! et j&#x27;ai lu tous les livres. Fuir ! là-bas fuir !</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Alone, alone, all, all alone, alone on a wide wide sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Suave, mari magno turbantibus aequora ventis, e terra magnum alterius spectare laborem;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >精卫衔微木，将以填沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >It keeps eternal whisperings around desolate shores,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Per correr miglior acque alza le vele omai la navicella del mio ingegno,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >荒海や佐渡によこたふ天河</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer ! La mer est ton miroir ; tu contemples ton âme</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Below about a thousand metres, no sunlight reaches the water.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。</tspan></textPath></text>

<text font-size="2.645" fill="#fff" xml:space="preserve"><textPath href="#L96" startOffset="4.4"><tspan font-family="'Noto Serif SC'" >白日依山尽，黄河入海流。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >潮汐主要由月球和太阳的引力引起。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Per correr miglior acque alza le vele omai la navicella del mio ingegno,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Full fathom five thy father lies; of his bones are coral made; those are pearls that were his eyes:</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >北冥有鱼，其名为鲲。鲲之大，不知其几千里也。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Por mares nunca de antes navegados</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλαττα θάλαττα</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The voice of the sea is seductive; never ceasing, whispering, clamoring, murmuring,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Ó mar salgado, quanto do teu sal são lágrimas de Portugal!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The sea is calm to-night. The tide is full, the moon lies fair upon the straits;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La mer, la mer, toujours recommencée</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >My soul is full of longing for the secret of the Sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The deepest known point of the ocean lies nearly eleven kilometres down.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >e il naufragar m&#x27;è dolce in questo mare.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Exultation is the going of an inland soul to sea, past the houses, past the headlands, into deep Eternity.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer ! La mer est ton miroir ; tu contemples ton âme</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >君不见黄河之水天上来，奔流到海不复回。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Tiefe Stille herrscht im Wasser, ohne Regung ruht das Meer,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I started Early, took my Dog, and visited the Sea;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The world below the brine, forests at the bottom of the sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >On the seashore of endless worlds children meet.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >百川东到海，何时复西归？</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >天下之水，莫大于海：万川归之，不知何时止而不盈；尾闾泄之，不知何时已而不虚。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La chair est triste, hélas ! et j&#x27;ai lu tous les livres. Fuir ! là-bas fuir !</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >小舟从此逝，江海寄余生。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >沧海月明珠有泪，蓝田日暖玉生烟。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >شب تاریک و بیم موج و گردابی چنین هایل، کجا دانند حال ما سبکباران ساحل‌ها</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Out of the cradle endlessly rocking,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Roll on, thou deep and dark blue Ocean, roll! Ten thousand fleets sweep over thee in vain;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Белеет парус одинокой в тумане моря голубом!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >and darkness was upon the face of the deep.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Break, break, break, on thy cold gray stones, O Sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Water, water, every where, nor any drop to drink.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan></textPath></text>

, serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I started Early, took my Dog, and visited the Sea;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >北冥有鱼，其名为鲲。鲲之大，不知其几千里也。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The deepest known point of the ocean lies nearly eleven kilometres down.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Roll on, thou deep and dark blue Ocean, roll! Ten thousand fleets sweep over thee in vain;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Elle est retrouvée. Quoi ? L&#x27;Éternité. C&#x27;est la mer allée avec le soleil.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >曾经沧海难为水，除却巫山不是云。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Exultation is the going of an inland soul to sea, past the houses, past the headlands, into deep Eternity.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Белеет парус одинокой в тумане моря голубом!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >北冥有鱼，其名为鲲。鲲之大，不知其几千里也。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >天下之水，莫大于海：万川归之，不知何时止而不盈；尾闾泄之，不知何时已而不虚。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >and darkness was upon the face of the deep.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >כל הנחלים הולכים אל הים והים איננו מלא</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La mer, la mer, toujours recommencée</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Water, water, every where, nor any drop to drink.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times <text font-size="2.350" fill="#fff" xml:space="preserve"><textPath href="#L100" startOffset="2.4"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Alone, alone, all, all alone, alone on a wide wide sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Oh ! combien de marins, combien de capitaines qui sont partis joyeux pour des courses lointaines,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >小舟从此逝，江海寄余生。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The deepest known point of the ocean lies nearly eleven kilometres down.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >On the seashore of endless worlds children meet.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >北冥有鱼，其名为鲲。鲲之大，不知其几千里也。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Yes, as every one knows, meditation and water are wedded for ever.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海洋覆盖了地球表面约百分之七十一。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >精卫衔微木，将以填沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >شب تاریک و بیم موج و گردابی چنین هایل، کجا دانند حال ما سبکباران ساحل‌ها</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Por mares nunca de antes navegados</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I started Early, took my Dog, and visited the Sea;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Roll on, thou deep and dark blue Ocean, roll! Ten thousand fleets sweep over thee in vain;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Прощай, свободная стихия! В последний раз передо мной ты катишь волны голубые</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >沧海月明珠有泪，蓝田日暖玉生烟。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The sea is calm to-night. The tide is full, the moon lies fair upon the straits;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >曾经沧海难为水，除却巫山不是云。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Per correr miglior acque alza le vele omai la navicella del mio ingegno,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >百川东到海，何时复西归？</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer ! La mer est ton miroir ; tu contemples ton âme</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春の海終日のたりのたりかな</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海上生明月，天涯共此时。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Tiefe Stille herrscht im Wasser, ohne Regung ruht das Meer,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλασσα ὕδωρ καθαρώτατον καὶ μιαρώτατον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The voice of the sea is seductive; never ceasing, whispering, clamoring, murmuring,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La mer, la mer, toujours recommencée</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >天下之水，莫大于海：万川归之，不知何时止而不盈；尾闾泄之，不知何时已而不虚。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Nuestras vidas son los ríos que van a dar en la mar, que es el morir;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Full fathom five thy father lies; of his bones are coral made; those are pearls that were his eyes:</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλαττα θάλαττα</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >My soul is full of longing for the secret of the Sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Break, break, break, on thy cold gray stones, O Sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Water, water, every where, nor any drop to drink.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Белеет парус одинокой в тумане моря голубом!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >It keeps eternal whisperings around desolate shores,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Below about a thousand metres, no sunlight reaches the water.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >长风破浪会有时，直挂云帆济沧海。</tspan></textPath></text>
<text font-size="2.281" fill="#fff" xml:space="preserve"><textPath href="#L101" startOffset="3.4"><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >潮汐主要由月球和太阳的引力引起。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >e il naufragar m&#x27;è dolce in questo mare.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >荒海や佐渡によこたふ天河</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >כל הנחלים הולכים אל הים והים איננו מלא</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Ó mar salgado, quanto do teu sal são lágrimas de Portugal!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The world below the brine, forests at the bottom of the sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >白日依山尽，黄河入海流。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >and darkness was upon the face of the deep.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Elle est retrouvée. Quoi ? L&#x27;Éternité. C&#x27;est la mer allée avec le soleil.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海日生残夜，江春入旧年。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La chair est triste, hélas ! et j&#x27;ai lu tous les livres. Fuir ! là-bas fuir !</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Exultation is the going of an inland soul to sea, past the houses, past the headlands, into deep Eternity.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Alone, alone, all, all alone, alone on a wide wide sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Suave, mari magno turbantibus aequora ventis, e terra magnum alterius spectare laborem;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Out of the cradle endlessly rocking,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >君不见黄河之水天上来，奔流到海不复回。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Elle est retrouvée. Quoi ? L&#x27;Éternité. C&#x27;est la mer allée avec le soleil.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Nuestras vidas son los ríos que van a dar en la mar, que es el morir;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Por mares nunca de antes navegados</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >e il naufragar m&#x27;è dolce in questo mare.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλασσα ὕδωρ καθαρώτατον καὶ μιαρώτατον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La chair est triste, hélas ! et j&#x27;ai lu tous les livres. Fuir ! là-bas fuir !</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Out of the cradle endlessly rocking,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海日生残夜，江春入旧年。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Yes, as every one knows, meditation and water are wedded for ever.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Break, break, break, on thy cold gray stones, O Sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, <text font-size="2.215" fill="#fff" xml:space="preserve"><textPath href="#L102" startOffset="0.5"><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Roll on, thou deep and dark blue Ocean, roll! Ten thousand fleets sweep over thee in vain;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The sea is calm to-night. The tide is full, the moon lies fair upon the straits;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >天下之水，莫大于海：万川归之，不知何时止而不盈；尾闾泄之，不知何时已而不虚。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春の海終日のたりのたりかな</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >精卫衔微木，将以填沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Прощай, свободная стихия! В последний раз передо мной ты катишь волны голубые</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >It keeps eternal whisperings around desolate shores,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Ó mar salgado, quanto do teu sal são lágrimas de Portugal!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >شب تاریک و بیم موج و گردابی چنین هایل، کجا دانند حال ما سبکباران ساحل‌ها</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Suave, mari magno turbantibus aequora ventis, e terra magnum alterius spectare laborem;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >On the seashore of endless worlds children meet.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La mer, la mer, toujours recommencée</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The deepest known point of the ocean lies nearly eleven kilometres down.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Oh ! combien de marins, combien de capitaines qui sont partis joyeux pour des courses lointaines,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Per correr miglior acque alza le vele omai la navicella del mio ingegno,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The voice of the sea is seductive; never ceasing, whispering, clamoring, murmuring,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >小舟从此逝，江海寄余生。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >沧海月明珠有泪，蓝田日暖玉生烟。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Full fathom five thy father lies; of his bones are coral made; those are pearls that were his eyes:</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >百川东到海，何时复西归？</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >My soul is full of longing for the secret of the Sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >北冥有鱼，其名为鲲。鲲之大，不知其几千里也。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >君不见黄河之水天上来，奔流到海不复回。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >白日依山尽，黄河入海流。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >长风破浪会有时，直挂云帆济沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海洋覆盖了地球表面约百分之七十一。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >君不见黄河之水天上来，奔流到海不复回。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Das Meer erglänzte weit hinaus im letzten Abendscheine;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >天下之水，莫大于海：万川归之，不知何时止而不盈；尾闾泄之，不知何时已而不虚。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >曾经沧海难为水，除却巫山不是云。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The deepest known point of the ocean lies nearly eleven kilometres down.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >πλέων ἐπὶ οἴνοπα πόντον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Tiefe Stille herrscht im Wasser, ohne Regung ruht das Meer,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Per correr miglior acque alza le vele omai la navicella del mio ingegno,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Suave, mari magno turbantibus aequora ventis, e terra magnum alterius spectare laborem;</tspan></textPath></text>
<text font-size="2.150" fill="#fff" xml:space="preserve"><textPath href="#L103" startOffset="4.8"><tspan font-family="'Noto Serif SC'" >海日生残夜，江春入旧年。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλασσα ὕδωρ καθαρώτατον καὶ μιαρώτατον</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Break, break, break, on thy cold gray stones, O Sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Roll on, thou deep and dark blue Ocean, roll! Ten thousand fleets sweep over thee in vain;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La mer, la mer, toujours recommencée</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Nuestras vidas son los ríos que van a dar en la mar, que es el morir;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >El barco sobre la mar y el caballo en la montaña.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >精卫衔微木，将以填沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >荒海や佐渡によこたふ天河</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Por mares nunca de antes navegados</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Full fathom five thy father lies; of his bones are coral made; those are pearls that were his eyes:</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >It keeps eternal whisperings around desolate shores,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I will go back to the great sweet mother, mother and lover of men, the sea.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The voice of the sea is seductive; never ceasing, whispering, clamoring, murmuring,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >长风破浪会有时，直挂云帆济沧海。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海水的平均盐度约为百分之三点五。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >百川东到海，何时复西归？</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Ó mar salgado, quanto do teu sal são lágrimas de Portugal!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >沧海月明珠有泪，蓝田日暖玉生烟。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >θάλαττα θάλαττα</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海洋覆盖了地球表面约百分之七十一。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Homme libre, toujours tu chériras la mer ! La mer est ton miroir ; tu contemples ton âme</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Below about a thousand metres, no sunlight reaches the water.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Times New Roman', 'Segoe UI'" >شب تاریک و بیم موج و گردابی چنین هایل، کجا دانند حال ما سبکباران ساحل‌ها</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Alone, alone, all, all alone, alone on a wide wide sea!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The world below the brine, forests at the bottom of the sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >I started Early, took my Dog, and visited the Sea;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >小舟从此逝，江海寄余生。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >观于海者难为水，游于圣人之门者难为言。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春の海終日のたりのたりかな</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Белеет парус одинокой в тумане моря голубом!</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Exultation is the going of an inland soul to sea, past the houses, past the headlands, into deep Eternity.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >潮汐主要由月球和太阳的引力引起。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >e il naufragar m&#x27;è dolce in questo mare.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >The sea is calm to-night. The tide is full, the moon lies fair upon the straits;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Прощай, свободная стихия! В последний раз передо мной ты катишь волны голубые</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >海上生明月，天涯共此时。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Water, water, every where, nor any drop to drink.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >La chair est triste, hélas ! et j&#x27;ai lu tous les livres. Fuir ! là-bas fuir !</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >All the rivers run into the sea; yet the sea is not full;</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Oh ! combien de marins, combien de capitaines qui sont partis joyeux pour des courses lointaines,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >My soul is full of longing for the secret of the Sea,</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif" >Elle est retrouvée. Quoi ? L&#x27;Éternité. C&#x27;est la mer allée avec le soleil.</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >北冥有鱼，其名为鲲。鲲之大，不知其几千里也。</tspan><tspan font-family="Cambria, Georgia, 'Times New Roman', serif">  ·  </tspan><tspan font-family="'Noto Serif SC'" >白日依山尽，黄河入海流。</tspan></textPath></text>
</svg></body></html>
